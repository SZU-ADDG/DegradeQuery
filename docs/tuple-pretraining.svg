<svg xmlns="http://www.w3.org/2000/svg" width="680" height="242" viewBox="0 0 680 242" role="img" aria-labelledby="title desc">
  <title id="title">Counterfactual tuple pretraining and degradation prediction</title>
  <desc id="desc">The same PROTAC is paired with its recorded target and E3 ligase. Replacing the target, the ligase, or both gives three contrasting combinations. The pretrained encoder is fine-tuned with labeled tuples to predict high or low degradation.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    .heading { font-size: 23px; font-weight: 650; }
    .row { font-size: 17px; fill: #253e43; }
    .column { font-size: 15px; font-weight: 600; fill: #36565b; }
    .token { font-size: 17px; font-weight: 650; text-anchor: middle; }
    .fine { font-size: 18px; fill: #f0fbfa; }
  </style>
  <defs>
    <g id="mol">
      <rect x="-26" y="-14" width="52" height="27" rx="7" fill="#ceeee8"/>
      <text class="token" y="6" fill="#135448">M</text>
    </g>
    <g id="target">
      <rect x="-26" y="-14" width="52" height="27" rx="7" fill="#e7e4fa"/>
      <text class="token" y="6" fill="#46356b">T</text>
    </g>
    <g id="target-alt">
      <rect x="-26" y="-14" width="52" height="27" rx="7" fill="#fff" stroke="#745f9c" stroke-dasharray="4 2"/>
      <text class="token" y="6" fill="#46356b">T′</text>
    </g>
    <g id="ligase">
      <rect x="-26" y="-14" width="52" height="27" rx="7" fill="#ffe5be"/>
      <text class="token" y="6" fill="#6a4618">E3</text>
    </g>
    <g id="ligase-alt">
      <rect x="-26" y="-14" width="52" height="27" rx="7" fill="#fff" stroke="#966e36" stroke-dasharray="4 2"/>
      <text class="token" y="6" fill="#6a4618">E3′</text>
    </g>
  </defs>

  <rect x="1" y="1" width="678" height="240" rx="15" fill="#f6f9f8" stroke="#b7cac8"/>
  <path d="M430 1H664Q679 1 679 16V226Q679 241 664 241H430Z" fill="#163d43"/>
  <text x="21" y="36" class="heading" fill="#173f43">Counterfactual pretraining</text>
  <text x="450" y="36" class="heading" fill="white">Fine-tuning</text>

  <g text-anchor="middle" class="column">
    <text x="180" y="69">PROTAC</text><text x="269" y="69">Target</text><text x="362" y="69">E3 ligase</text>
  </g>
  <g class="row">
    <text x="21" y="101" font-weight="650">Recorded</text>
    <text x="21" y="141">Swap target</text>
    <text x="21" y="177">Swap ligase</text>
    <text x="21" y="213">Swap both</text>
  </g>
  <path d="M21 116H403" stroke="#b7cac8"/>
  <g>
    <use href="#mol" x="180" y="95"/><use href="#target" x="269" y="95"/><use href="#ligase" x="362" y="95"/>
    <use href="#mol" x="180" y="135"/><use href="#target-alt" x="269" y="135"/><use href="#ligase" x="362" y="135"/>
    <use href="#mol" x="180" y="171"/><use href="#target" x="269" y="171"/><use href="#ligase-alt" x="362" y="171"/>
    <use href="#mol" x="180" y="207"/><use href="#target-alt" x="269" y="207"/><use href="#ligase-alt" x="362" y="207"/>
  </g>

  <text x="450" y="78" class="fine">Pretrained tuple encoder</text>
  <text x="450" y="105" class="fine">+ labeled tuples</text>
  <path d="M462 119V146m-6-6 6 6 6-6" fill="none" stroke="#88d7c7" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="450" y="178" fill="white" font-size="27" font-weight="650">High / low</text>
  <text x="450" y="206" class="fine">target degradation</text>
</svg>
