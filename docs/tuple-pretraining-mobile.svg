<svg xmlns="http://www.w3.org/2000/svg" width="358" height="252" viewBox="0 0 358 252" role="img" aria-labelledby="title desc">
  <title id="title">Pretraining and fine-tuning in DegradeQuery</title>
  <desc id="desc">Each row uses the same molecule. The target, ligase, or both can be swapped. The encoder is then fine-tuned with labeled records to predict high or low target degradation.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    .label { font-size: 15px; fill: #253e43; }
    .col { font-size: 13px; font-weight: 650; fill: #36565b; text-anchor: middle; }
    .token { font-size: 15px; font-weight: 650; text-anchor: middle; }
  </style>
  <defs>
    <g id="m">
      <rect x="-22" y="-11" width="44" height="22" rx="6" fill="#ceeee8"/>
      <text class="token" y="5" fill="#135448">M</text>
    </g>
    <g id="t">
      <rect x="-22" y="-11" width="44" height="22" rx="6" fill="#e7e4fa"/>
      <text class="token" y="5" fill="#46356b">T</text>
    </g>
    <g id="t-alt">
      <rect x="-22" y="-11" width="44" height="22" rx="6" fill="#fff" stroke="#745f9c" stroke-dasharray="4 2"/>
      <text class="token" y="5" fill="#46356b">T′</text>
    </g>
    <g id="e">
      <rect x="-22" y="-11" width="44" height="22" rx="6" fill="#ffe5be"/>
      <text class="token" y="5" fill="#6a4618">E3</text>
    </g>
    <g id="e-alt">
      <rect x="-22" y="-11" width="44" height="22" rx="6" fill="#fff" stroke="#966e36" stroke-dasharray="4 2"/>
      <text class="token" y="5" fill="#6a4618">E3′</text>
    </g>
  </defs>

  <rect x="1" y="1" width="356" height="250" rx="12" fill="#f6f9f8" stroke="#b7cac8"/>
  <text x="15" y="28" font-size="20" font-weight="650" fill="#173f43">Counterfactual pretraining</text>
  <g class="col">
    <text x="157" y="53">PROTAC</text><text x="232" y="53">Target</text><text x="307" y="53">E3 ligase</text>
  </g>
  <g class="label">
    <text x="15" y="80" font-weight="650">Recorded</text>
    <text x="15" y="110">Swap target</text>
    <text x="15" y="137">Swap ligase</text>
    <text x="15" y="164">Swap both</text>
  </g>
  <path d="M15 91H343" stroke="#b7cac8"/>
  <g>
    <use href="#m" x="157" y="75"/><use href="#t" x="232" y="75"/><use href="#e" x="307" y="75"/>
    <use href="#m" x="157" y="105"/><use href="#t-alt" x="232" y="105"/><use href="#e" x="307" y="105"/>
    <use href="#m" x="157" y="132"/><use href="#t" x="232" y="132"/><use href="#e-alt" x="307" y="132"/>
    <use href="#m" x="157" y="159"/><use href="#t-alt" x="232" y="159"/><use href="#e-alt" x="307" y="159"/>
  </g>
  <path d="M1 182H357V239Q357 251 345 251H13Q1 251 1 239Z" fill="#163d43"/>
  <text x="15" y="208" font-size="20" font-weight="650" fill="white">Fine-tuning</text>
  <text x="15" y="232" font-size="15" fill="#f0fbfa">Labeled tuples → high / low target degradation</text>
</svg>
